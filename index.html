function mkEv(){const id=P(['vec','rob','llu','rum','tru','tru']),e={id};if(id=='tru')e.x=P([['lat',3,'agua',10],['pil',4,'lat',3],['bar',4,'gas',6]]);return e}
const EV={vec:['👶 Un vecino con un bebé te pide comida.',['Dar 2 raciones','Negar']],rob:['🔦 Oís ruidos: intentan entrar a robar.',['Salir a enfrentar','Esconderse']],llu:['🌧️ Llueve fuerte.',['Recolectar agua','Ignorar']],rum:['📻 Rumor: reparten comida en el centro.',['Ir a ver','Quedarse']],tru:['🤝 Un vecino ofrece trueque.',['Aceptar','Rechazar']]};
function evHtml(){const e=G.ev,t=EV[e.id];return `<div class=card style="border-color:var(--r)"><b>${t[0]}</b>${e.x?`<p>Dar ${e.x[1]} de ${NM[e.x[0]]} por ${e.x[3]} de ${NM[e.x[2]]}.</p>`:''}${t[1].map((l,k)=>`<button onclick="evo(${k})">${l}</button>`).join('')}</div>`}
function evo(k){const e=G.ev,c=cat(),As=A(),T=TT(),m=P(As),i=G.i,id=e.id;let r='';
if(id=='vec')if(!k){if(take(2)){As.forEach(x=>x.mo=K(x.mo+8));G.hist.gave++;r='Ayudaste al vecino: sube el ánimo.'}else r='No tenías suficiente para dar.'}else{As.forEach(x=>x.mo=K(x.mo-5));r='Negaste ayuda; pesa en el ánimo.'}
if(id=='rob'){if(G.pl.a=='guardia')r='Tu guardia ahuyentó a los ladrones.';else if(!k&&Math.random()<.5)r='Los espantaste a gritos.';else{if(!k)m.hp=K(m.hp-15);['agua','lat','bar','cer','med'].forEach(q=>i[q]=Math.floor(i[q]*.75));r='Robaron parte de tus provisiones'+(k?'':' y saliste herido/a')+'.'}}
if(id=='llu'){if(!k){if(c.dirty)G.wd+=15;else i.agua+=15;r='Juntaste 15 L de lluvia'+(c.dirty?' (sin tratar)':'')+'.'}else r='Dejaste pasar la lluvia.'}
if(id=='rum'){if(!k){if(Math.random()<.5){i.lat+=T*2;r='Era cierto: conseguiste comida.'}else{m.hp=K(m.hp-10);m.mo=K(m.mo-6);r='Era falso. Volviste cansado/a y expuesto/a.'}}else r='Te quedaste en casa.'}
if(id=='tru'){const[g,gq,w,wq]=e.x;if(!k)if(i[g]>=gq){i[g]-=gq;i[w]+=wq;r='Trueque hecho.'}else r='No tenías lo necesario.';else r='Rechazaste.'}
G.ev=null;G.log.unshift(r);beep(400);day()}
const DS=[['ref','Refugio oficial',40,'Comida y agua del estado, pero hacinado y con más contagio.'],['fam','Casa de familiares',80,'Comparten comida y agua; sube el ánimo.'],['cam','Campo',200,'Pozo de agua limpia y huerta; viaje largo.']];
function mvs(){out(`<h2>Mudarse</h2><p class=m>Con auto: 1 día y 1 L de nafta cada 10 km (15% de avería). A pie: 1 día cada 20 km, con más riesgo. Solo podés llevar ${A().length*10+(G.car?60:0)} de espacio; el resto se deja.</p>${DS.map(d=>`<button onclick="mv('${d[0]}',${d[2]})"><b>${d[1]}</b> · ${d[2]} km<br><small>${d[3]}</small></button>`).join('')}<button onclick="day()">Quedarse</button>`)}
function mv(id,km){if(G.loc==id)return day();const fuel=km/10,by=G.car&&G.i.naf>=fuel,cp=A().length*10+(G.car?60:0),u=used();if(u>cp){const r=cp/u;Object.keys(G.i).forEach(k=>{if(k!='naf')G.i[k]=G.i[k]*r});G.fr.forEach(b=>b[0]*=r);G.log.unshift('🎒 Dejaste parte de tus cosas por falta de espacio.')}
let d=by?1:Math.ceil(km/20);if(by){G.i.naf-=fuel;if(Math.random()<.15){d++;G.log.unshift('🔧 Se averió el auto en el camino.')}}else G.log.unshift('🚶 Viajás a pie: '+d+' día(s).');
G.out=1;G.ev=null;for(let k=0;k<d&&A().length&&G.day<=G.D;k++)pass();G.out=0;G.loc=id;G.mv=1;if(!A().length)return fin('dead');if(G.day>G.D)return fin('win');G.log.unshift('📍 Llegaste: '+LOCN[id]+'.');day()}
function fin(k){G.scr='end';const As=A(),n=G.m.length,T=TT(),ok=k=='win',ti=!ok?'No sobrevivieron':G.loc!='home'?'Llegaron a salvo a '+LOCN[G.loc]:food()>T*3?'Autosuficientes':'Rescatados',sc=As.length*100+Math.min(G.day,G.D)*10+Math.round(food()+G.i.agua/3);
const ach=[[As.length==n,'👨‍👩‍👧 Sin bajas'],[G.hist.gave>=2,'🤲 Generoso'],[ok&&food()>T*3,'📦 Previsor'],[G.mv,'🧭 Viajero'],[G.hist.red>=5,'⚖️ Dosificador']].filter(a=>a[0]).map(a=>a[1]);localStorage.removeItem('dc');beep(ok?660:150,.5);
out(`<div class=card><h1>${ok?'🏁':'💀'} ${ti}</h1><p>${cat().ic} ${cat().n} · ${Math.min(G.day,G.D)} de ${G.D} días · sobrevivientes ${As.length}/${n}</p><h3>Puntaje ${sc}</h3><p>${ach.join(' · ')||'Sin logros esta vez'}</p></div>
<div class=card><b>Consejos reales para tu kit</b><p class=m>3 litros de agua por persona por día, más la de cocina e higiene. Priorizá enlatados y comida que no necesite cocción. Tené efectivo en billetes chicos, radio y pilas, botiquín y medicación para varios días. Conocé tu ruta y tu punto de reunión, y no esperes a último momento para abastecerte.</p></div>
<button class=p onclick="setup()">Jugar de nuevo</button><button onclick="navigator.share?navigator.share({text:'Sobreviví en Día Cero: ${ti}. Puntaje ${sc}'}):alert('Puntaje ${sc}')">Compartir resultado</button>`)}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');intro();
</script></body></html>
