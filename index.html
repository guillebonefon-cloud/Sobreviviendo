function fer2(i,msg,L){const x=G[L][i],ks=Object.keys(x.st).filter(k=>x.st[k]>0);out(`<h2>${x.n}</h2><p class=m>${x.j}, ${x.t}. ${msg||''}<br>Tiene: ${ks.map(k=>nm(k)+' '+x.st[k]).join(', ')||'nada'}</p><label>Das <select id=g>${TK.filter(k=>hv(k)>=1).map(k=>`<option value=${k}>${nm(k)} (tenés ${Math.floor(hv(k))})</option>`).join('')}</select></label><input id=gq type=number value=1 min=1><label>Pedís <select id=w>${ks.map(k=>`<option value=${k}>${nm(k)}</option>`).join('')}</select></label><input id=wq type=number value=1 min=1><button class=p onclick="prop(${i},'${L}')">Proponer</button><button onclick="${L=='nb'?'fer':'vis'}()">Volver</button>`)}
function prop(i,L,a){const x=G[L][i];let g,gq,w,wq;if(a)[g,gq,w,wq]=a;else{g=$('#g').value;gq=+$('#gq').value;w=$('#w').value;wq=+$('#wq').value}
if(!g||!w||g==w||!(gq>=1)||!(wq>=1))return fer2(i,'Revisá la propuesta.',L);if(hv(g)<gq)return fer2(i,'No tenés tanto para dar.',L);if((x.st[w]||0)<wq)return fer2(i,'No tiene tanto.',L);
const f=fe(x),gv=vx(g)*gq*f,rv=vx(w)*wq;
if(gv>=rv){tr(g,gq,w,wq);x.st[w]-=wq;x.st[g]=(x.st[g]||0)+gq;x.u=G.day;G.rl=G.rl||{};if(vx(g)*gq>rv*1.4)G.rl[x.n]=(G.rl[x.n]||0)+1;G.log.unshift('🤝 '+x.n+': diste '+gq+' de '+nm(g)+' y recibiste '+wq+' de '+nm(w)+'.');beep(500);return L=='nb'?fer():vis()}
const q2=Math.ceil(rv/(vx(g)*f));q2<=hv(g)?out(`<h2>${x.n}</h2><p>No le alcanza. Contraoferta: pide <b>${q2}</b> de ${nm(g)} por ${wq} de ${nm(w)}.</p><button class=p onclick="prop(${i},'${L}',['${g}',${q2},'${w}',${wq}])">Aceptar contraoferta</button><button onclick="fer2(${i},'','${L}')">Seguir regateando</button>`):fer2(i,'No acepta ese cambio.',L)}
function hu(){G.hu=G.hu||[];const i=G.i,sl=(G.home=='casa'?6:3)+i.mac*3,rd=G.hu.filter(h=>h.d>=5).length,ok=G.hu.length<sl;
out(`<h2>🌱 Huerta</h2><p class=m>Cada planta tarda 5 días, usa 2 L de agua por día y rinde 3 o 4 raciones frescas. El calor trae plagas. Lugares: ${G.hu.length}/${sl}.</p>${G.hu.map(h=>`<div class=it><span>Planta (${h.y} raciones)</span><span>${Math.min(h.d,5)}/5 días${h.w?' · sedienta':''}</span></div>`).join('')}<button ${i.sem>=1&&ok?'':'disabled'} onclick="pl(1)">Plantar con semillas (tenés ${Math.floor(i.sem)})</button><button ${G.fr.some(b=>b[0]>=1)&&ok?'':'disabled'} onclick="pl(0)">Plantar 1 ración de verduras frescas</button><button class=p ${rd?'':'disabled'} onclick="cos()">Cosechar (${rd} listas)</button><button onclick="day()">Volver</button>`)}
function pl(q){if(q){G.i.sem--;G.hu.push({d:0,y:4})}else{G.fr.find(b=>b[0]>=1)[0]-=1;G.hu.push({d:0,y:3})}hu()}
function cos(){const r=G.hu.filter(h=>h.d>=5),y=r.reduce((a,h)=>a+h.y,0);G.fr.push([y,0]);G.hu=G.hu.filter(h=>h.d<5);G.log.unshift('🥬 Cosechaste '+y+' raciones frescas.');beep(600);hu()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');intro();
</script></body></html>
